<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delete Account — LearnGraph AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#060810;--surface:#0c0f1a;--card:#111520;--border:#1e2640;--accent:#4f8ef7;--accent2:#6366f1;--green:#22c55e;--red:#ef4444;--text:#f0f4ff;--muted:#5a6585;--muted2:#8892b0}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.wrap{width:100%;max-width:440px}
.card{background:var(--surface);border:1px solid color-mix(in srgb,var(--red) 30%,transparent);border-radius:20px;padding:36px;text-align:center}
.danger-icon{font-size:56px;margin-bottom:16px}
.card-title{font-size:22px;font-weight:900;color:var(--red);margin-bottom:10px}
.card-sub{font-size:14px;color:var(--muted2);line-height:1.6;margin-bottom:28px}
.field{margin-bottom:16px;text-align:left}
.field label{display:block;font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;font-weight:700;margin-bottom:6px}
.field input{width:100%;padding:12px 14px;background:var(--card);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:border-color 0.15s}
.field input:focus{border-color:var(--red)}
.field input::placeholder{color:var(--muted)}
.btn-danger{width:100%;padding:14px;background:var(--red);border:none;border-radius:12px;color:#fff;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:12px;transition:all 0.15s;opacity:0.5;cursor:not-allowed}
.btn-danger.active{opacity:1;cursor:pointer}
.btn-danger.active:hover{background:#dc2626}
.btn-cancel{display:block;text-align:center;color:var(--muted2);text-decoration:none;font-size:14px;font-weight:600;padding:10px;transition:color 0.15s}
.btn-cancel:hover{color:var(--accent)}
.error-box{background:color-mix(in srgb,var(--red) 12%,transparent);border:1px solid color-mix(in srgb,var(--red) 30%,transparent);border-radius:10px;padding:12px 16px;font-size:13px;color:var(--red);margin-bottom:16px;text-align:left}
.confirm-hint{font-size:12px;color:var(--muted2);text-align:left;margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="danger-icon">⚠️</div>
    <div class="card-title">Delete Account</div>
    <div class="card-sub">
      This will permanently delete your account and all data including quiz history, progress, and learning paths. <strong style="color:var(--red)">This cannot be undone.</strong>
    </div>

    {% if error %}<div class="error-box">⚠ {{ error }}</div>{% endif %}

    <form method="POST">
      {% csrf_token %}
      <div class="field">
        <label>Confirm Password</label>
        <input type="password" name="password" placeholder="Enter your password" required>
      </div>
      <div class="field">
        <label>Type DELETE to confirm</label>
        <input type="text" name="confirm" id="confirm-input" placeholder="DELETE" oninput="checkConfirm(this.value)" autocomplete="off">
        <div class="confirm-hint">Type exactly: DELETE</div>
      </div>
      <button type="submit" class="btn-danger" id="delete-btn" disabled>🗑️ Permanently Delete Account</button>
    </form>
    <a href="{% url 'account' %}" class="btn-cancel">← Cancel, go back</a>
  </div>
</div>
<script>
function checkConfirm(val) {
  const btn = document.getElementById('delete-btn');
  if (val === 'DELETE') { btn.disabled = false; btn.classList.add('active'); }
  else { btn.disabled = true; btn.classList.remove('active'); }
}
</script>
</body>
</html>
